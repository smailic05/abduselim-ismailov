<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ s.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ s.name }}, {{ s.eyebrow|lower }}: биография, книги, повести, рассказы и пьесы.{% endblock %}">
<link rel="preload" href="/static/fonts/pt-serif-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Cpath fill=%27%238c2b2b%27 fill-rule=%27evenodd%27 d=%27M10 1l9 9-9 9-9-9zM10 5.5L5.5 10l4.5 4.5 4.5-4.5z%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#f6f0e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block content %}{% endblock %}
</body>
</html>
