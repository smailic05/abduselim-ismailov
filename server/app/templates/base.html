<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ s.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ s.name }}, {{ s.eyebrow|lower }}: биография, книги, повести, рассказы и пьесы.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block content %}{% endblock %}
</body>
</html>
